openapi: 3.1.0
info:
  title: API PJE Calc
  version: 0.1.0-rascunho
  summary: API de cálculos trabalhistas sobre o motor oficial do PJe-Calc Cidadão
  description: |
    Contrato inicial (rascunho) da API. Fonte da verdade para servidor, cliente da interface e documentação.
    Ver docs/06-api/. Projeto independente, sem vínculo com o CSJT, o TST ou o TRT8.
servers:
  - url: http://127.0.0.1:8080/v1
    description: App local no Windows (ADR-0006)
security:
  - sessaoLocal: []
tags:
  - { name: Cálculos, description: Especificações versionadas }
  - { name: Liquidações, description: Execução no motor e resultados }
  - { name: Jobs, description: Processamento assíncrono }
  - { name: Importação, description: Entrada de .PJC e CSV }
  - { name: Catálogos, description: Valores lidos do motor }
  - { name: Utilitários, description: Serviços auxiliares }
  - { name: Saúde, description: Monitoramento }
paths:
  /calculos:
    post:
      tags: [Cálculos]
      operationId: criarCalculo
      summary: Cria um cálculo (versão 1) a partir de uma especificação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/especificacao-calculo.schema.json' }
      responses:
        '201':
          description: Criado
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calculo' }
        '422': { $ref: '#/components/responses/Problema' }
    get:
      tags: [Cálculos]
      operationId: listarCalculos
      summary: Lista os cálculos
      parameters:
        - { name: processo, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusCalculo' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limite' }
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens: { type: array, items: { $ref: '#/components/schemas/CalculoResumo' } }
                  proximoCursor: { type: [string, 'null'] }
  /calculos/{calculoId}:
    parameters: [ { $ref: '#/components/parameters/CalculoId' } ]
    get:
      tags: [Cálculos]
      operationId: obterCalculo
      summary: Obtém a especificação vigente
      parameters:
        - { name: resolvida, in: query, description: Devolve a especificação com os padrões do PJe-Calc explícitos, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Calculo' } } }
        '404': { $ref: '#/components/responses/Problema' }
    patch:
      tags: [Cálculos]
      operationId: alterarCalculo
      summary: Altera a especificação (JSON Merge Patch) criando nova versão
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { type: object }
      responses:
        '200':
          description: Nova versão
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Calculo' } } }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
    delete:
      tags: [Cálculos]
      operationId: excluirCalculo
      summary: Exclusão lógica e agendamento de expurgo (LGPD)
      responses:
        '204': { description: Excluído }
  /calculos/{calculoId}/versoes:
    parameters: [ { $ref: '#/components/parameters/CalculoId' } ]
    get:
      tags: [Cálculos]
      operationId: listarVersoes
      summary: Lista as versões imutáveis
      responses:
        '200':
          description: Versões imutáveis
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Versao' } }
  /calculos/{calculoId}/validacoes:
    parameters: [ { $ref: '#/components/parameters/CalculoId' } ]
    post:
      tags: [Cálculos]
      operationId: validarCalculo
      summary: Valida (rápido = só API, síncrono; motor = pendências do PJe-Calc, assíncrono)
      parameters:
        - { name: modo, in: query, schema: { type: string, enum: [rapido, motor], default: rapido } }
      responses:
        '200':
          description: Resultado da validação rápida
          content: { application/json: { schema: { $ref: '#/components/schemas/ResultadoValidacao' } } }
        '202': { $ref: '#/components/responses/JobAceito' }
  /calculos/{calculoId}/liquidacoes:
    parameters: [ { $ref: '#/components/parameters/CalculoId' } ]
    post:
      tags: [Liquidações]
      operationId: liquidarCalculo
      summary: Enfileira a liquidação da versão vigente no motor oficial
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataLiquidacao]
              properties:
                dataLiquidacao: { type: string, format: date }
                versao: { type: integer, description: Versão da especificação; padrão = vigente }
                atualizarTabelas: { type: boolean, default: false }
      responses:
        '202': { $ref: '#/components/responses/JobAceito' }
        '422': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
  /liquidacoes/{liquidacaoId}:
    parameters: [ { $ref: '#/components/parameters/LiquidacaoId' } ]
    get:
      tags: [Liquidações]
      operationId: obterLiquidacao
      summary: Obtém uma liquidação e seu resumo
      responses:
        '200':
          description: Liquidação com resumo estruturado
          content: { application/json: { schema: { $ref: '#/components/schemas/Liquidacao' } } }
  /liquidacoes/{liquidacaoId}/artefatos/{tipo}:
    parameters:
      - { $ref: '#/components/parameters/LiquidacaoId' }
      - { name: tipo, in: path, required: true, schema: { type: string, enum: [pjc, pdf, html, json] } }
    get:
      tags: [Liquidações]
      operationId: baixarArtefato
      summary: Redireciona para URL assinada de curta duração
      responses:
        '302': { description: Redirecionamento para download }
        '404': { $ref: '#/components/responses/Problema' }
  /jobs/{jobId}:
    parameters: [ { name: jobId, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [Jobs]
      operationId: obterJob
      summary: Consulta o status de um job
      responses:
        '200': { description: Status do job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
    delete:
      tags: [Jobs]
      operationId: cancelarJob
      summary: Cancela um job na fila
      responses:
        '204': { description: Cancelado }
        '409': { $ref: '#/components/responses/Problema' }
  /importacoes:
    post:
      tags: [Importação]
      operationId: importarPjc
      summary: Envia um .PJC para virar um cálculo editável
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo: { type: string, contentMediaType: application/zip }
      responses:
        '202': { $ref: '#/components/responses/JobAceito' }
        '413': { $ref: '#/components/responses/Problema' }
  /catalogos/verbas:
    get:
      tags: [Catálogos]
      operationId: listarVerbasCatalogo
      summary: Biblioteca de verbas do motor
      parameters:
        - { name: regional, in: query, schema: { type: string } }
        - { name: busca, in: query, schema: { type: string } }
      responses:
        '200':
          description: Biblioteca de verbas do motor alvo
          content:
            application/json:
              schema:
                type: object
                properties:
                  versaoPjeCalc: { type: string }
                  hashTabelas: { type: string }
                  verbas: { type: array, items: { $ref: '#/components/schemas/VerbaCatalogo' } }
  /catalogos/{nome}:
    get:
      tags: [Catálogos]
      operationId: obterCatalogo
      summary: Valores de um catálogo
      parameters:
        - { name: nome, in: path, required: true, schema: { type: string, enum: [indices-correcao, juros, regimes, tipos-de-base, municipios, feriados] } }
      responses:
        '200': { description: Lista de valores, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /tabelas/versao:
    get:
      tags: [Catálogos]
      operationId: versaoTabelas
      summary: Versão do PJe-Calc e hash das tabelas
      responses:
        '200': { description: Versão do PJe-Calc e hash das tabelas por regional, content: { application/json: { schema: { type: object } } } }
  /utilitarios/selic:
    get:
      tags: [Utilitários]
      operationId: fatorSelic
      summary: Fator SELIC acumulado no período
      parameters:
        - { name: inicio, in: query, required: true, schema: { type: string, format: date } }
        - { name: fim, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Fator acumulado, content: { application/json: { schema: { type: object, properties: { fator: { type: string } } } } } }
  /saude:
    get:
      tags: [Saúde]
      operationId: saude
      summary: Verificação de saúde
      security: []
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    sessaoLocal:
      type: apiKey
      in: cookie
      name: pjecalc_sessao
      description: Token aleatório gerado a cada início do app e entregue só à interface local
  headers:
    ETag:
      description: Versão da especificação (ex. "v3")
      schema: { type: string }
  parameters:
    CalculoId: { name: calculoId, in: path, required: true, schema: { type: string, format: uuid } }
    LiquidacaoId: { name: liquidacaoId, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limite: { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, format: uuid } }
  responses:
    JobAceito:
      description: Job criado
      headers:
        Location: { schema: { type: string }, description: 'URL do job: /v1/jobs/{jobId}' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } }
    Problema:
      description: Erro (RFC 9457)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
  schemas:
    StatusCalculo: { type: string, enum: [rascunho, valido, liquidado, arquivado] }
    CalculoResumo:
      type: object
      properties:
        id: { type: string, format: uuid }
        numeroProcesso: { type: [string, 'null'] }
        reclamante: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/StatusCalculo' }
        versao: { type: integer }
        atualizadoEm: { type: string, format: date-time }
    Calculo:
      allOf:
        - $ref: '#/components/schemas/CalculoResumo'
        - type: object
          properties:
            especificacao: { $ref: './schemas/especificacao-calculo.schema.json' }
            ultimaLiquidacao: { type: [string, 'null'], format: uuid }
    Versao:
      type: object
      properties:
        numero: { type: integer }
        criadaEm: { type: string, format: date-time }
        autor: { type: string }
        sha256: { type: string }
    ResultadoValidacao:
      type: object
      properties:
        valido: { type: boolean }
        erros: { type: array, items: { $ref: '#/components/schemas/ItemErro' } }
        avisos: { type: array, items: { $ref: '#/components/schemas/ItemErro' } }
    ItemErro:
      type: object
      required: [caminho, codigo, mensagem]
      properties:
        caminho: { type: string, description: JSON Pointer na especificação }
        codigo: { type: string }
        mensagem: { type: string }
        origem: { type: string, enum: [api, pjecalc] }
        mensagemOriginal: { type: string }
    Job:
      type: object
      properties:
        id: { type: string }
        tipo: { type: string, enum: [liquidacao, validacao_motor, importacao_pjc, atualizacao] }
        status: { type: string, enum: [em_fila, processando, concluido, falhou, cancelado] }
        etapas:
          type: array
          items:
            type: object
            properties:
              nome: { type: string }
              status: { type: string, enum: [pendente, em_andamento, concluida, falhou] }
              ms: { type: integer }
        resultado: { type: [object, 'null'], description: 'Ex.: {"liquidacaoId": "..."}' }
        erro: { oneOf: [ { $ref: '#/components/schemas/Problema' }, { type: 'null' } ] }
        motor:
          type: object
          properties:
            versaoPjeCalc: { type: string }
            regional: { type: string }
            hashTabelas: { type: string }
    Liquidacao:
      type: object
      properties:
        id: { type: string, format: uuid }
        calculoId: { type: string, format: uuid }
        versaoEspecificacao: { type: integer }
        dataLiquidacao: { type: string, format: date }
        status: { type: string, enum: [processando, concluida, falhou] }
        motor:
          type: object
          properties:
            versaoPjeCalc: { type: string }
            hashTabelas: { type: string }
            regional: { type: string }
            hashLiquidacao: { type: string, description: Hash gravado pelo PJe-Calc na liquidação }
        resumo: { $ref: '#/components/schemas/ResumoLiquidacao' }
        artefatos:
          type: array
          items:
            type: object
            properties:
              tipo: { type: string, enum: [pjc, pdf, html, json] }
              sha256: { type: string }
              tamanho: { type: integer }
    ResumoLiquidacao:
      type: object
      description: Valores como string decimal
      properties:
        brutoDevidoReclamante: { type: string }
        liquidoDevidoReclamante: { type: string }
        totalDevidoPeloReclamado: { type: string }
        verbas:
          type: array
          items:
            type: object
            properties:
              nome: { type: string }
              valorCorrigido: { type: string }
              juros: { type: string }
              total: { type: string }
        fgts: { type: string }
        contribuicaoSocialReclamante: { type: string }
        contribuicaoSocialReclamado: { type: string }
        impostoDeRenda: { type: string }
        honorarios: { type: string }
        custas: { type: string }
    VerbaCatalogo:
      type: object
      properties:
        nome: { type: string }
        caracteristica: { type: string }
        incidencias: { type: object }
        reflexosPadrao: { type: array, items: { type: string } }
    Problema:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        codigo: { type: string }
        detail: { type: string }
        erros: { type: array, items: { $ref: '#/components/schemas/ItemErro' } }
        traceId: { type: string }
